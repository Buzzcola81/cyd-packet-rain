name: Build and Release Firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e cyd

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Prepare release binaries
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          cp .pio/build/cyd/bootloader.bin    "bootloader-${TAG}.bin"
          cp .pio/build/cyd/partitions.bin    "partitions-${TAG}.bin"
          cp .pio/build/cyd/firmware.bin      "firmware-${TAG}.bin"

      - name: Update manifest.json for GitHub Pages
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          cat > docs/manifest.json <<EOF
          {
            "name": "CYD Packet Rain",
            "version": "${TAG}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  {
                    "path": "${BASE_URL}/bootloader-${TAG}.bin",
                    "offset": 4096
                  },
                  {
                    "path": "${BASE_URL}/partitions-${TAG}.bin",
                    "offset": 32768
                  },
                  {
                    "path": "${BASE_URL}/firmware-${TAG}.bin",
                    "offset": 65536
                  }
                ]
              }
            ]
          }
          EOF

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git add docs/manifest.json
          git diff --cached --quiet || git commit -m "Update manifest for ${{ steps.version.outputs.tag }}"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bootloader-${{ steps.version.outputs.tag }}.bin
            partitions-${{ steps.version.outputs.tag }}.bin
            firmware-${{ steps.version.outputs.tag }}.bin
          generate_release_notes: true
